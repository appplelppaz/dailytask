[project]
name = "competitor-keywords"
version = "0.1.0"
description = "競合EC商品ページの検索キーワード分析ツール"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "altair>=5",
    "pandas>=2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "anthropic>=1.8",
    "pydantic>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
