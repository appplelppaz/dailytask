<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070a">
<title>NIGHT ROUTINE</title>
<meta name="description" content="A clock-driven night routine that shows its time as a place, not a number.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #05070a; color: #fff;
    font-family: Inter, system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ── chrome: as little as the world can carry ── */
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 2;
        padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
  #corner { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 12px;
            display: flex; gap: 2px; pointer-events: auto; }
  #corner button {
    width: 44px; height: 44px; display: grid; place-items: center;
    background: none; border: 0; cursor: pointer; color: rgba(255,255,255,.34);
    transition: color .3s ease;
  }
  #corner button:hover, #corner button:focus-visible { color: rgba(255,255,255,.85); outline: none; }
  #corner button svg { width: 17px; height: 17px; }
  #soundBtn[data-on="0"] .on { display: none; }
  #soundBtn[data-on="1"] .off { display: none; }

  #caption { position: absolute; left: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); max-width: 72vw; }
  #taskName {
    margin: 0; font-size: clamp(15px, 3.4vw, 19px); font-weight: 500;
    letter-spacing: .38em; color: rgba(255,255,255,.82);
    transition: opacity .8s ease, color .8s ease;
  }
  #taskName[data-state="dormant"] { opacity: .38; }
  #taskName[data-state="closing"] { color: rgba(255,255,255,.95); }
  #worldName {
    margin: 7px 0 0; font-size: 11px; font-weight: 300; letter-spacing: .22em;
    color: rgba(255,255,255,.26); text-transform: uppercase;
  }
  #hint {
    margin: 10px 0 0; font-size: 11.5px; font-weight: 300; letter-spacing: .09em; line-height: 1.6;
    color: rgba(255,255,255,.5); min-height: 1.2em; max-width: 30ch;
    transition: opacity .6s ease;
  }

  /* ── the completion target: a hit area, never a label ── */
  #affordance {
    position: fixed; z-index: 3; background: none; border: 0; padding: 0; margin: 0;
    cursor: grab; touch-action: none; border-radius: 22px;
  }
  #affordance:active { cursor: grabbing; }
  #affordance:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 4px; }

  /* ── the archive: a wall of marks ── */
  #archive { position: fixed; inset: 0; z-index: 10; }
  #archBackdrop { position: absolute; inset: 0; background: rgba(3,4,6,.88); backdrop-filter: blur(6px); }
  #archPanel {
    position: absolute; inset: auto 50% 0 auto; transform: translateX(50%);
    width: min(620px, 100%); max-height: 86vh; overflow: auto;
    background: #0a0c10; border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px 22px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 680px) { #archPanel { inset: 50% 50% auto auto; transform: translate(50%, -50%); border-radius: 22px; } }
  #archHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #archHead h2 { margin: 0; font-size: 11px; font-weight: 400; letter-spacing: .3em; color: rgba(255,255,255,.5); }
  #archClose { width: 40px; height: 40px; background: none; border: 0; color: rgba(255,255,255,.45); cursor: pointer; }
  .arch-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; align-items: center; }
  .arch-head { margin-bottom: 6px; }
  .arch-label { font-size: 8.5px; letter-spacing: .12em; color: rgba(255,255,255,.3); text-align: center; }
  .arch-cell { display: grid; place-items: center; aspect-ratio: 1; border-radius: 10px; }
  .arch-today .arch-cell { background: rgba(255,255,255,.035); }
  .arch-empty { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.12); }
  #archNote { margin: 14px 2px 0; font-size: 10.5px; font-weight: 300; line-height: 1.7; color: rgba(255,255,255,.3); }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div id="ui">
  <div id="corner">
    <button id="soundBtn" type="button" aria-label="音のオンとオフ" aria-pressed="true" data-on="1">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5a4 4 0 0 1 0 5"/>
      </svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 10l4 4M21 10l-4 4"/>
      </svg>
    </button>
    <button id="shiftBtn" type="button" aria-label="別の世界へ切り替える">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h10l-2.5-2.5M20 17H10l2.5 2.5"/><circle cx="18" cy="7" r="2"/><circle cx="6" cy="17" r="2"/>
      </svg>
    </button>
    <button id="archiveBtn" type="button" aria-label="痕跡の記録をひらく">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="7" r="2.6"/><circle cx="17" cy="7" r="2.6"/><circle cx="7" cy="17" r="2.6"/><circle cx="17" cy="17" r="2.6"/>
      </svg>
    </button>
  </div>

  <div id="caption">
    <p id="taskName">&nbsp;</p>
    <p id="worldName">&nbsp;</p>
    <p id="hint"></p>
  </div>
</div>

<button id="affordance" type="button" hidden aria-label="タスクを完了としてマーク"></button>

<div id="archive" hidden>
  <div id="archBackdrop"></div>
  <div id="archPanel" role="dialog" aria-modal="true" aria-label="痕跡の記録">
    <div id="archHead">
      <h2>TRACES</h2>
      <button id="archClose" type="button" aria-label="とじる">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div id="archRows"></div>
    <p id="archNote">上の行が今夜。完了した世界だけが、その世界の痕跡を残します。</p>
  </div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
