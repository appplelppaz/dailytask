<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070a">
<title>NIGHT ROUTINE</title>
<meta name="description" content="A clock-driven night routine that shows its time as a place, not a number.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #05070a; color: #fff;
    font-family: Inter, system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ── chrome: as little as the world can carry ── */
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 2;
        padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
  #corner { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 12px;
            display: flex; gap: 2px; pointer-events: auto; }
  #corner button {
    width: 44px; height: 44px; display: grid; place-items: center;
    background: none; border: 0; cursor: pointer; color: rgba(255,255,255,.34);
    transition: color .3s ease;
  }
  #corner button:hover, #corner button:focus-visible { color: rgba(255,255,255,.85); outline: none; }
  #corner button svg { width: 17px; height: 17px; }
  #soundBtn[data-on="0"] .on { display: none; }
  #soundBtn[data-on="1"] .off { display: none; }

  #caption { position: absolute; left: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); max-width: 72vw; }
  #taskName {
    margin: 0; font-size: clamp(15px, 3.4vw, 19px); font-weight: 500;
    letter-spacing: .38em; color: rgba(255,255,255,.82);
    transition: opacity .8s ease, color .8s ease;
  }
  #taskName[data-state="dormant"] { opacity: .38; }
  #taskName[data-state="closing"] { color: rgba(255,255,255,.95); }
  #taskName[data-state="paused"] { opacity: .55; }
  #worldName {
    margin: 7px 0 0; font-size: 11px; font-weight: 300; letter-spacing: .22em;
    color: rgba(255,255,255,.26); text-transform: uppercase;
  }
  #hint {
    margin: 10px 0 0; font-size: 11.5px; font-weight: 300; letter-spacing: .09em; line-height: 1.6;
    color: rgba(255,255,255,.5); min-height: 1.2em; max-width: 30ch;
    transition: opacity .6s ease;
  }
  #hint[data-paused] { color: rgba(255,255,255,.88); letter-spacing: .12em; }

  /* ── the three seconds before a night begins ── */
  #countdown {
    position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
    pointer-events: none;
  }
  #countdown span {
    font-size: clamp(88px, 34vw, 190px); font-weight: 200; line-height: 1;
    letter-spacing: .02em; color: rgba(255,255,255,.9);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 60px rgba(255,255,255,.28);
  }
  #countdown[data-beat] span { animation: countBeat .92s cubic-bezier(.16,1,.3,1) both; }
  @keyframes countBeat {
    from { opacity: 0; transform: scale(1.35); }
    22%  { opacity: 1; transform: scale(1); }
    to   { opacity: .16; transform: scale(.97); }
  }
  @media (prefers-reduced-motion: reduce) {
    #countdown[data-beat] span { animation: none; opacity: 1; }
  }

  /* ── the completion target: a hit area over the mark the canvas draws ── */
  #affordance {
    position: fixed; z-index: 3; background: none; border: 0; padding: 0; margin: 0;
    cursor: pointer; touch-action: none; border-radius: 50%;
  }
  #affordance:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 4px; }

  /* ── sheets: Record and Settings ── */
  .sheet { position: fixed; inset: 0; z-index: 10; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(3,4,6,.88); backdrop-filter: blur(6px); }
  .sheet-panel {
    position: absolute; inset: auto 50% 0 auto; transform: translateX(50%);
    width: min(620px, 100%); max-height: 86vh; overflow: auto;
    background: #0a0c10; border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px 22px 0 0; padding: 18px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 680px) { .sheet-panel { inset: 50% 50% auto auto; transform: translate(50%, -50%); border-radius: 22px; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 11px; font-weight: 400; letter-spacing: .3em; color: rgba(255,255,255,.5); }
  .sheet-close { width: 40px; height: 40px; background: none; border: 0; color: rgba(255,255,255,.45); cursor: pointer; }
  .sheet-close:hover, .sheet-close:focus-visible { color: #fff; }

  /* ── settings ── */
  .set-label { margin: 0 0 12px; font-size: 11px; letter-spacing: .16em; color: rgba(255,255,255,.55); }
  .set-stepper { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .set-stepper button {
    width: 54px; height: 54px; flex: none; border-radius: 50%;
    background: none; border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.8);
    font-size: 20px; line-height: 1; cursor: pointer; transition: border-color .2s ease, color .2s ease;
  }
  .set-stepper button:hover:not(:disabled), .set-stepper button:focus-visible { border-color: rgba(255,255,255,.5); color: #fff; }
  .set-stepper button:disabled { opacity: .25; cursor: default; }
  #offsetValue {
    flex: 1; text-align: center; font-size: 21px; font-weight: 300; letter-spacing: .04em;
    color: #fff; font-variant-numeric: tabular-nums;
  }
  .set-times { display: flex; gap: 8px; margin: 18px 0 0; }
  .set-times > div {
    flex: 1; padding: 12px 10px; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; text-align: center;
  }
  .set-times dt { font-size: 9.5px; letter-spacing: .14em; color: rgba(255,255,255,.35); }
  .set-times dd { margin: 5px 0 0; font-size: 17px; font-weight: 300; color: #fff; font-variant-numeric: tabular-nums; }
  .set-times dd small { font-size: 11px; color: rgba(255,255,255,.3); margin-right: 5px; text-decoration: line-through; }
  .set-reset {
    display: block; margin: 16px auto 0; padding: 9px 16px; min-height: 40px;
    background: none; border: 0; color: rgba(255,255,255,.4); font-size: 11px; letter-spacing: .1em; cursor: pointer;
  }
  .set-reset:hover, .set-reset:focus-visible { color: #fff; }
  .set-note { margin: 18px 2px 0; font-size: 9.5px; font-weight: 300; line-height: 1.8; color: rgba(255,255,255,.28); letter-spacing: .04em; }
  /* ── the record: a plain month calendar ── */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-size: 13px; font-weight: 400; letter-spacing: .1em; color: rgba(255,255,255,.85); }
  .cal-nav {
    width: 40px; height: 40px; background: none; border: 0; cursor: pointer;
    font-size: 18px; line-height: 1; color: rgba(255,255,255,.5); transition: color .2s ease;
  }
  .cal-nav:hover:not(:disabled), .cal-nav:focus-visible { color: #fff; }
  .cal-nav:disabled { opacity: .2; cursor: default; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
  .cal-week span { text-align: center; font-size: 9.5px; letter-spacing: .06em; color: rgba(255,255,255,.3); }
  .cal-week span[data-sun] { color: rgba(255,150,150,.4); }
  .cal-week span[data-sat] { color: rgba(150,190,255,.4); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 7px 0 8px; border-radius: 9px;
  }
  .cal-day[data-today] { background: rgba(255,255,255,.07); }
  .cal-day[data-future] { opacity: .28; }
  .cal-num { font-size: 11.5px; font-weight: 400; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; }
  .cal-day[data-today] .cal-num { color: #fff; font-weight: 600; }
  .cal-day[data-full] .cal-num { color: rgba(255,255,255,.9); }
  .cal-dots { display: flex; gap: 1.5px; height: 5px; }
  .cal-dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.09); }
  .cal-day[data-future] .cal-dots { visibility: hidden; }

  .cal-legend {
    list-style: none; display: flex; flex-wrap: wrap; gap: 7px 14px;
    margin: 20px 0 0; padding: 14px 2px 0; border-top: 1px solid rgba(255,255,255,.08);
  }
  .cal-legend li { display: flex; align-items: center; gap: 6px; }
  .cal-legend i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .cal-legend span { font-size: 9.5px; letter-spacing: .12em; color: rgba(255,255,255,.5); }
</style>
</head>
<body>

<canvas id="stage" tabindex="0" role="button" aria-pressed="false" aria-label="タスクの進行を一時停止"></canvas>

<div id="ui">
  <div id="corner">
    <button id="soundBtn" type="button" aria-label="音のオンとオフ" aria-pressed="true" data-on="1">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5a4 4 0 0 1 0 5"/>
      </svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 10l4 4M21 10l-4 4"/>
      </svg>
    </button>
    <button id="shiftBtn" type="button" aria-label="別の世界へ切り替える">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h10l-2.5-2.5M20 17H10l2.5 2.5"/><circle cx="18" cy="7" r="2"/><circle cx="6" cy="17" r="2"/>
      </svg>
    </button>
    <button id="settingsBtn" type="button" aria-label="設定をひらく">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/>
      </svg>
    </button>
    <button id="archiveBtn" type="button" aria-label="記録をひらく">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="7" r="2.6"/><circle cx="17" cy="7" r="2.6"/><circle cx="7" cy="17" r="2.6"/><circle cx="17" cy="17" r="2.6"/>
      </svg>
    </button>
  </div>

  <div id="caption">
    <p id="taskName">&nbsp;</p>
    <p id="worldName">&nbsp;</p>
    <p id="hint"></p>
  </div>
</div>

<div id="countdown" hidden aria-live="assertive" aria-atomic="true"><span></span></div>

<button id="affordance" type="button" hidden aria-label="タスクを完了としてマーク"></button>

<div id="archive" class="sheet" hidden>
  <div id="archBackdrop" class="sheet-backdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="記録">
    <div class="sheet-head">
      <h2>RECORD</h2>
      <button id="archClose" class="sheet-close" type="button" aria-label="とじる">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>
    <div id="archRows"></div>
  </div>
</div>

<div id="settings" class="sheet" hidden>
  <div id="setBackdrop" class="sheet-backdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="設定">
    <div class="sheet-head">
      <h2>SETTINGS</h2>
      <button id="setClose" class="sheet-close" type="button" aria-label="とじる">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
      </button>
    </div>

    <p class="set-label">開始時間</p>
    <div class="set-stepper">
      <button id="offsetDown" type="button" aria-label="開始を10分早める">−</button>
      <span id="offsetValue" role="status" aria-live="polite">±0分</span>
      <button id="offsetUp" type="button" aria-label="開始を10分遅らせる">＋</button>
    </div>

    <dl class="set-times">
      <div><dt>平日</dt><dd id="wdTime">19:30</dd></div>
      <div><dt>土日</dt><dd id="weTime">20:00</dd></div>
    </dl>

    <button id="offsetReset" class="set-reset" type="button" hidden>もとに戻す</button>

    <p class="set-note">タスクの長さと順番はそのままに、その夜の開始時刻ごと前後へずらします。今夜だけの調整です — 翌日はデフォルト（平日19:30／土日20:00）に戻ります。<br>画面をタップすると進行を一時停止、もう一度タップで再開します。止めた分だけ、あとのタスクの開始も後ろへずれます。</p>
  </div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
